services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: plumb
      POSTGRES_PASSWORD: plumb
      POSTGRES_DB: plumb
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plumb -d plumb"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - plumb-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  plumb-postgres:
